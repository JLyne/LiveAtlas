    <script>
        // 获取元素
        const calculatorIcon = document.getElementById('calculator-icon');
        const calculatorContainer = document.getElementById('calculator-container');
       // 监听计算器图标点击事件
        calculatorIcon.addEventListener('click', () => {
            // 切换计算器容器的显示/隐藏状态
            if (calculatorContainer.style.display === 'none' || calculatorContainer.style.display === '') {
                calculatorContainer.style.display = 'flex'; // 显示
            } else {
                calculatorContainer.style.display = 'none'; // 隐藏
            }
        });
      
              // 右上角小×关闭计算器窗口
        function closeCalculator() {
            const calculatorContainer = document.getElementById('calculator-container');
            calculatorContainer.style.display = 'none';
        }

      
        //计算坐标的脚本
        let computedX, computedZ;
        function calculateCoordinates() {
            // 获取输入值
            const latitude = parseFloat(document.getElementById('latitude').value);
            const longitude = parseFloat(document.getElementById('longitude').value);
            // 检查输入是否有效
            if (isNaN(latitude) || isNaN(longitude)) {
                alert("请输入有效的纬度和经度！");
                return;
            }
              // 检查是否为特殊的数字，触发“彩蛋”提示
    if ([1145, 114, 114514, 4514, -1145, -114, -114514, -4514].includes(latitude) || [ -1145, -114, -114514, -4514,1145, 114, 114514, 4514].includes(longitude)) {
        alert("好臭");
    }
    if ([666,-666].includes(latitude) || [-666,666].includes(longitude)) {
        alert("666666你发现了彩蛋");
    }
    // 检查纬度是否在有效范围内
    if (latitude < -90 || latitude > 90) {
        alert("纬度必须在 -90 到 90 之间！");
        return ;
    }

    // 检查经度是否在有效范围内
    if (longitude < -180 || longitude > 180) {
        alert("经度必须在 -180 到 180 之间！");
        return ;
    }

            // 计算X坐标（经度）
            computedX = ((longitude + 180) / 360) * 43008 - 21504;
            // 计算Z坐标（纬度）
            computedZ = ((-latitude + 90) / 180) * 21504 - 10752;
            // 显示结果
            const resultElement = document.getElementById('计算坐标');
            resultElement.innerHTML = `
                <h2>计算结果</h2>
                <p><strong>X坐标：</strong>${Math.round(computedX)}</p>
                <p><strong>Z坐标：</strong>${Math.round(computedZ)}</p>
            `;
            // 显示“快速定位”按钮
            document.getElementById('quick-locate-button').style.display = 'block';
        }
        function quickLocate() {
            // 构建URL并跳转
            const x = Math.round(computedX);
            const z = Math.round(computedZ);
            const url = `/#world;flat;${x},64,${z};5`;
            window.location.href = url;
        }


      
        window.addEventListener('load', () => {
            if(!window.liveAtlasLoaded) {
                document.getElementById('splash__error').setAttribute('aria-hidden', 'false');
                document.getElementById('splash__error-message').innerText = 'Required LiveAtlas files are missing or failed to load.\nPlease reinstall LiveAtlas.';
                document.getElementById('splash__spinner').style.visibility = 'hidden';
            }
        });
    </script>
  </body>
</html>
